<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#6a7280;--bd:#e6e8ec;--pri:#e8590c;--ink:#14181f;--ok:#16a34a;--wn:#d97706;--bad:#dc2626;--inf:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.6}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--ink);color:#c9cfd9;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;color:#fff;font-weight:800;font-size:20px}
.brand i{width:36px;height:36px;border-radius:11px;background:var(--pri);display:grid;place-items:center;font-style:normal}
.nav{flex:1}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:3px;text-align:start}
.nav button:hover{background:rgba(255,255,255,.06)}.nav button.on{background:var(--pri);color:#fff;font-weight:700}
.nav b{margin-inline-start:auto;background:#fff;color:var(--pri);border-radius:99px;min-width:22px;text-align:center;font-size:12px}
.me{border-top:1px solid rgba(255,255,255,.1);padding:14px 8px 0;font-size:12px;color:#8e97a6;word-break:break-all}
.me button{margin-top:8px;width:100%;border:1px solid rgba(255,255,255,.18);background:none;color:#fff;border-radius:9px;padding:7px;font:inherit;cursor:pointer}
.top{background:#fff;border-bottom:1px solid var(--bd);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:20px}.tools{display:flex;gap:10px;align-items:center}
main{padding:24px 26px;min-width:0}
.srch{width:260px}
input,textarea,select{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--tx)}
textarea{width:100%;min-height:80px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.kpi .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px;line-height:1.2}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{color:var(--mut);font-weight:600;font-size:12px;background:#fafbfc}th,td{padding:12px 10px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}
tr.cl:hover td{background:#fafbfc;cursor:pointer}.emp{text-align:center;color:var(--mut);padding:36px}
.tag{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c)}
.who{display:flex;align-items:center;gap:10px}.av{width:36px;height:36px;border-radius:11px;background:#eef0f3;display:grid;place-items:center;font-weight:800;color:var(--ink)}
.av.lg{width:64px;height:64px;font-size:26px;border-radius:18px;background:var(--pri);color:#fff;margin:0 auto 8px}.who small{display:block;color:var(--mut);font-size:12px}
.cc{display:inline-block;background:#eef0f3;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;margin-inline-end:6px}.ph{direction:ltr;display:inline-block}
.dc{display:inline-block;margin-inline-end:6px;padding:2px 8px;border-radius:8px;font-size:12px}.dc.y{background:#dcfce7;color:#166534}.dc.n{background:#fee2e2;color:#991b1b}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:#fff;padding:5px 13px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip i{font-style:normal;opacity:.6;margin-inline-start:4px}
.btn{border:0;background:var(--pri);color:#fff;padding:9px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gh{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:rgba(15,18,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:#fff;border-radius:18px;padding:22px;max-width:1000px;width:100%;max-height:92vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.mh h3{margin:0}.x{border:0;background:#eef0f3;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:16px}
.pane{display:grid;grid-template-columns:320px 1fr;gap:22px}.pi{text-align:center;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--bd)}.kv span:first-child{color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.dt{font-weight:700;margin-bottom:10px}
.doc{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:14px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fafbfc;border-bottom:1px solid var(--bd)}.dh a{color:var(--pri);font-weight:700;text-decoration:none}
.doc img{display:block;width:100%;max-height:340px;object-fit:contain;background:#f1f2f4;cursor:zoom-in}.doc iframe{width:100%;height:360px;border:0}
.doc.miss{padding:26px;text-align:center;color:var(--mut);background:#fff7f7;border-style:dashed}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:12px;color:#fff;font-weight:700;z-index:50;background:var(--ink)}.toast.err{background:var(--bad)}
.lb{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}.card input:not([type=number]){width:100%}
.danger{margin-top:22px;border-top:1px solid var(--bd);padding-top:12px}
.dl{font-size:12px;font-weight:700;margin-inline-start:6px}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.att{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}.att:hover{background:#fafbfc}.att b{background:var(--pri);color:#fff;border-radius:99px;padding:0 10px}.att.z b{background:#d5d9e0}
.hb{height:8px;border-radius:5px;background:var(--pri);margin-top:4px}.sm{display:block;color:var(--mut);font-size:12px;font-weight:400}.sres{cursor:pointer}.sres:hover{background:#fafbfc}
code{background:#eef0f3;padding:2px 6px;border-radius:6px;font-size:12px}
.lg{max-width:380px;margin:12vh auto;padding:28px}.lg input{width:100%;margin-bottom:12px}.lg h1{margin:0 0 4px;font-size:24px}
.load{text-align:center;color:var(--mut);padding:80px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.brand{padding:0 8px}.nav{display:flex;gap:4px}.nav button{white-space:nowrap;width:auto}.me{display:none}.pane,.two{grid-template-columns:1fr}.srch{width:150px}main{padding:16px}.top{padding:12px 16px}}
</style>

<script>
(function(){
function show(t){var r=document.getElementById('root');if(r)r.innerHTML='<div style="max-width:520px;margin:60px auto;padding:20px;font:15px/1.8 sans-serif;direction:rtl;color:#b91c1c;background:#fff;border:1px solid #fecaca;border-radius:12px"><b>تعذّر تشغيل لوحة الإدارة</b><br>'+t+'</div>';}
window.__show=show;
if(typeof window.supabase==='undefined')show('ملف <code>vendor/supabase.js</code> مش موجود أو مش بيتحمّل. ارفع فولدر <code>vendor</code> كامل جنب index.html.');
else if(typeof window.CFG==='undefined'||!window.CFG.url||!window.CFG.key||/YOUR-/.test(window.CFG.url+window.CFG.key))show('ملف <code>config.js</code> مش موجود أو فيه بيانات Supabase غير مكتملة.');
window.addEventListener('error',function(e){if(document.querySelector('#root .load'))show('خطأ في تشغيل الصفحة: <code>'+String(e.message).replace(/</g,'&lt;')+'</code>');});
})();
</script>

<body>
<div id="root"><div class="load">جاري التحميل...</div></div><div id="ov"></div>
<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>Number(n||0).toLocaleString('ar-EG')+' ج';
const fd=d=>d?new Date(d).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'—';
const fdd=d=>d?new Date(d).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'}):'—';
const ES={pending:['بانتظار المراجعة','#d97706'],approved:['معتمد','#16a34a'],rejected:['مرفوض','#dc2626'],suspended:['موقوف','#dc2626'],deleted:['محذوف','#6a7280']};
const OS={new:['طلب جديد','#2563eb'],accepted:['قبِل المهندس','#2563eb'],received:['تم الاستلام','#d97706'],quoted:['بانتظار العميل','#d97706'],verifying:['بانتظار تأكيد الدفع','#d97706'],delivered:['بانتظار تقييم العميل','#d97706'],paid:['تم الدفع','#16a34a'],progress:['جاري الإصلاح','#d97706'],done:['تم التسليم','#16a34a'],declined:['رفض العرض','#dc2626'],cancelled:['ملغي','#dc2626']};
const PM={bank:'تحويل بنكي',instapay:'إنستا باي',vodafone:'فودافون كاش'};
const PS={pending:['بانتظار المراجعة','#d97706'],confirmed:['مؤكد','#16a34a'],rejected:['مرفوض','#dc2626']};
const pm=x=>x.pay_method?`<span class="tag" style="--c:#2563eb">${PM[x.pay_method]}</span> <span class="ph">${E(x.pay_account)}</span>`:'<span style="color:var(--mut)">لم تُربط</span>';
const rate=x=>x.rating_count?`<b style="color:#f5a623">★</b> ${Number(x.rating_avg).toFixed(1)} <span style="color:var(--mut)">(${x.rating_count})</span>`:'—';
const starsTxt=n=>'<span style="color:#f5a623">'+'★'.repeat(n)+'</span><span style="color:#d5d9e0">'+'★'.repeat(5-n)+'</span>';
const tag=a=>`<span class="tag" style="--c:${a[1]}">${a[0]}</span>`;
const phone=x=>x.phone?`${x.country?`<span class="cc">${E(x.country)}</span>`:''}<span class="ph">${E(x.phone)}</span>`:'—';
const who=x=>`<div class="who"><div class="av">${E((x.full_name||'?').trim().charAt(0))}</div><div><b>${E(x.full_name)||'—'}</b><small>${E(x.city)||''}</small></div></div>`;
const dots=(...p)=>p.map(([l,v])=>`<span class="dc ${v?'y':'n'}">${l} ${v?'✓':'✕'}</span>`).join('');
const empty='<tr><td colspan="9" class="emp">لا توجد بيانات</td></tr>';
let LAST=new Date(),MF={has:false,aal:'aal1'},LOGLIM=300;
let V='dash',F={e:'all',c:'all',o:'all',p:'all',a:'all'},Q='',D={E:[],C:[],O:[],W:[],P:[],S:{},A:[],R:[],L:[],rate:30},ME=null;
function toast(t,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function loginUI(msg){$('#root').innerHTML=`<div class="lg card"><h1>🔧 صلحني</h1><p style="color:var(--mut);margin:0 0 18px">لوحة الإدارة</p>${msg?`<p style="color:var(--bad)">${E(msg)}</p>`:''}<input id="ph" placeholder="الإيميل أو رقم الموبايل" autocomplete="username"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password" onkeydown="if(event.key=='Enter')signin()"><button class="btn" style="width:100%" onclick="signin()">دخول</button></div>`}
let FAILS=0,LOCKUNTIL=0;
async function signin(){if(Date.now()<LOCKUNTIL)return loginUI('محاولات كتير غلط. استنى '+Math.ceil((LOCKUNTIL-Date.now())/1000)+' ثانية');
 const v=$('#ph').value.trim();const{error}=await sb.auth.signInWithPassword({email:v.includes('@')?v.toLowerCase():v+'@salhni.app',password:$('#pw').value});
 if(error){FAILS++;if(FAILS>=5)LOCKUNTIL=Date.now()+60000*Math.min(FAILS-4,5);return loginUI('بيانات الدخول غلط')}
 FAILS=0;boot()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return loginUI();
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(!p||p.role!=='admin'){await sb.auth.signOut();return loginUI('هذا الحساب ليس أدمن')}
 ME={...p,email:session.user.email};sb.rpc('log_event',{kind:'admin_login',info:(navigator.userAgent||'').slice(0,100)});
 const[{data:lv},{data:fl}]=await Promise.all([sb.auth.mfa.getAuthenticatorAssuranceLevel(),sb.auth.mfa.listFactors()]);const ver=(fl&&fl.totp)||[];
 MF={has:ver.length>0,aal:lv&&lv.currentLevel};
 if(ver.length&&MF.aal!=='aal2')return mfaChallenge(ver[0].id);
 const{data:rq}=await sb.from('settings').select('value').eq('key','require_admin_mfa').maybeSingle();
 if(rq&&rq.value=='1'&&!ver.length)return mfaEnroll(true);
 $('#root').innerHTML='<div class="load">جاري تحميل البيانات...</div>';await load();render()}
/* ---------- two-factor ---------- */
const mfaUI=h=>{$('#root').innerHTML=`<div class="lg card">${h}</div>`};
const codeInp=fn=>`<input id="mc" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;font-size:22px;letter-spacing:6px" oninput="this.value=this.value.replace(/\\D/g,'')" onkeydown="if(event.key=='Enter')${fn}">`;
function mfaChallenge(fid){mfaUI(`<h1>التحقق بخطوتين</h1><p style="color:var(--mut)">اكتب الكود المكوّن من 6 أرقام من تطبيق المصادقة (Google Authenticator أو Authy).</p>${codeInp(`mfaLogin('${fid}')`)}<button class="btn" style="width:100%" onclick="mfaLogin('${fid}')">تأكيد</button><p><a href="#" onclick="sb.auth.signOut().then(()=>loginUI());return false">تسجيل خروج</a></p>`)}
async function mfaVerify(fid,code){const{data:c,error:e1}=await sb.auth.mfa.challenge({factorId:fid});if(e1)return toast(e1.message,1),false;const{error}=await sb.auth.mfa.verify({factorId:fid,challengeId:c.id,code});if(error)return toast('الكود غلط',1),false;return true}
async function mfaLogin(fid){if(await mfaVerify(fid,$('#mc').value))boot()}
async function mfaEnroll(forced){const{data:fl}=await sb.auth.mfa.listFactors();for(const f of((fl&&fl.all)||[]))if(f.status!=='verified')await sb.auth.mfa.unenroll({factorId:f.id});
 const{data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Salhni '+Date.now()});if(error)return toast(error.message,1);
 mfaUI(`<h1>تفعيل التحقق بخطوتين</h1><p style="color:var(--mut)">امسح الكود بتطبيق المصادقة، وبعدها اكتب الكود اللي بيظهر.</p><div style="text-align:center"><img src="${data.totp.qr_code}" width="190" height="190" alt="QR"></div><p style="word-break:break-all;font-size:12px;color:var(--mut)">أو اكتب المفتاح يدوياً: <b dir="ltr">${E(data.totp.secret)}</b></p>${codeInp(`mfaDone('${data.id}')`)}<button class="btn" style="width:100%" onclick="mfaDone('${data.id}')">تفعيل</button>${forced?'':'<p><a href="#" onclick="boot();return false">إلغاء</a></p>'}`)}
async function mfaDone(id){if(await mfaVerify(id,$('#mc').value)){toast('تم تفعيل التحقق بخطوتين');boot()}}
async function mfaRequire(on){if(!confirm(on?'هتفرض التحقق بخطوتين على كل صلاحيات الأدمن. متأكد إنك دخلت بالكود بنجاح؟':'إيقاف فرض التحقق بخطوتين؟'))return;const{error}=await sb.from('settings').upsert({key:'require_admin_mfa',value:on?'1':'0'});if(error)return toast(error.message,1);await load();render();toast('تم الحفظ')}
async function signAll(){if(!confirm('تسجيل الخروج من كل الأجهزة؟'))return;await sb.auth.signOut({scope:'global'});ME=null;loginUI('تم تسجيل الخروج من كل الأجهزة')}
async function load(){const[e,c,o,w,s,pp,ad,rs,lg]=await Promise.all([
 sb.from('profiles').select('*').eq('role','engineer').order('created_at',{ascending:false}),
 sb.from('profiles').select('*, vehicles(*)').eq('role','customer').order('created_at',{ascending:false}),
 sb.from('requests').select('*, vehicles(brand,model,plate), customer:profiles!customer_id(full_name,phone), engineer:profiles!engineer_id(full_name)').order('created_at',{ascending:false}),
 sb.from('withdrawals').select('*, engineer:profiles!engineer_id(full_name)').order('created_at',{ascending:false}),
 sb.from('settings').select('*'),
 sb.from('payments').select('*, customer:profiles!customer_id(full_name,phone), request:requests(problem,total)').order('created_at',{ascending:false}),
 sb.from('balance_adjustments').select('*').order('created_at',{ascending:false}),
 sb.from('ratings').select('*'),
 sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(LOGLIM)]);
 LAST=new Date();const S={};(s.data||[]).forEach(x=>S[x.key]=x.value);D={E:e.data||[],C:c.data||[],O:o.data||[],W:w.data||[],P:pp.data||[],A:ad.data||[],R:rs.data||[],L:lg.data||[],S,rate:+(S.commission_rate||30)}}
const NAV=[['dash','📊','الرئيسية'],['e','🧑‍🔧','المهندسين'],['c','👤','العملاء'],['o','📋','الطلبات'],['p','💳','المدفوعات'],['f','💰','المالية'],['a','🛡️','سجل النشاط'],['s','⚙️','الإعدادات']];
const PAGES={dash:()=>dash(),e:()=>engs(),c:()=>custs(),o:()=>ords(),p:()=>pays(),a:()=>audit(),f:()=>fin(),s:()=>sets()};
function render(){const cnt={e:D.E.filter(x=>x.status=='pending').length,c:D.C.filter(x=>x.status=='pending'&&x.vehicles.length).length,o:D.O.filter(x=>x.status=='new').length,p:D.P.filter(x=>x.status=='pending').length,f:D.W.filter(x=>x.status=='pending').length};
$('#root').innerHTML=`<div class="app"><aside><div class="brand"><i>🔧</i>صلحني</div><div class="nav">${NAV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="V='${n[0]}';Q='';render()">${n[1]} ${n[2]}${cnt[n[0]]?`<b>${cnt[n[0]]}</b>`:''}</button>`).join('')}</div><div class="me">${E(ME.email)}<button onclick="sb.auth.signOut().then(()=>loginUI())">تسجيل خروج</button></div></aside>
<div><header class="top"><div><h2>${NAV.find(n=>n[0]==V)[2]}</h2><small class="sm">آخر تحديث ${LAST.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</small></div><div class="tools">${['e','c','o','p','a'].includes(V)?`<input class="srch" placeholder="بحث بالاسم أو الرقم..." value="${E(Q)}" oninput="Q=this.value;rerender()">`:''}<button class="btn gh" onclick="openSearch()" title="Ctrl+K">بحث سريع</button>${['e','c','o','p','a'].includes(V)?'<button class="btn gh" onclick="exportCsv()">تصدير CSV</button>':''}<button class="btn gh" onclick="refresh()">تحديث</button></div></header><main>${PAGES[V]()}</main></div></div>`}

return `<div class="card">${chips('e',ES,D.E,'status')}<div class="tw"><table><thead><tr><th>المهندس</th><th>الموبايل</th><th>رقم الكارنيه</th><th>المستندات</th><th>محفظة الأرباح</th><th>التقييم</th><th>الرصيد</th><th>التسجيل</th><th>الحالة</th></tr></thead><tbody>${l.map(x=>`<tr class="cl" onclick="openE('${x.id}')"><td>${who(x)}</td><td>${phone(x)}</td><td>${E(x.syndicate_no)||'—'}</td><td>${dots(['صورة',x.avatar_path],['كارنيه',x.card_path],['CV',x.cv_path])}</td><td>${pm(x)}</td><td>${rate(x)}</td><td${Number(x.balance)<0?' style="color:var(--bad);font-weight:700"':''}>${m(x.balance)}</td><td>${fdd(x.created_at)}</td><td>${tag(ES[x.status])}</td></tr>`).join('')||empty}</tbody></table></div></div>`}
async function openE(id){const x=D.E.find(e=>e.id==id);md(mh('مراجعة مهندس')+'<div class="load">جاري تحميل المستندات...</div>');
 const dc=await docs([['الصورة الشخصية (من الكاميرا)',x.avatar_path,'avatars'],['كارنيه النقابة',x.card_path],['السيرة الذاتية (CV)',x.cv_path]]);const done=D.O.filter(o=>o.engineer_id==id&&o.status=='done');
 md(mh('مراجعة مهندس')+`<div class="pane"><div>${info(x,`<div class="kv"><span>رقم الكارنيه</span><span><b>${E(x.syndicate_no)||'—'}</b></span></div><div class="kv"><span>محفظة الأرباح</span><span>${x.pay_method?PM[x.pay_method]:'لم تُربط'}</span></div>${x.pay_method?`<div class="kv"><span>الحساب / الرقم</span><span class="ph"><b>${E(x.pay_account)}</b></span></div>${x.pay_bank?`<div class="kv"><span>البنك</span><span>${E(x.pay_bank)}</span></div>`:''}${x.pay_holder?`<div class="kv"><span>اسم صاحب الحساب</span><span>${E(x.pay_holder)}</span></div>`:''}`:''}<div class="kv"><span>الرصيد</span><span>${m(x.balance)}</span></div><div class="kv"><span>التقييم</span><span>${rate(x)}</span></div><div class="kv"><span>عمولة خاصة (فاضي = ${D.rate}%)</span><span><input id="co" type="number" min="0" max="100" step="0.5" value="${x.commission_override==null?'':x.commission_override}" style="width:80px;padding:4px"> % <button class="btn gh" style="padding:4px 10px" onclick="saveCO('${x.id}')">حفظ</button></span></div><div class="kv"><span>سيارات تم إصلاحها</span><span>${done.length}</span></div>`)}${actions(id,x.status)}<div class="dt" style="margin-top:18px">الرصيد والخصومات</div><div class="acts" style="margin-top:6px"><button class="btn bad" onclick="askAdj('${id}',-1)">خصم من الرصيد</button><button class="btn gh" onclick="askAdj('${id}',1)">إضافة للرصيد</button></div><div id="adj"></div>${D.A.filter(a=>a.engineer_id==id).map(a=>`<div class="kv"><span>${fdd(a.created_at)} — ${E(a.reason)}</span><b style="color:${a.amount<0?'var(--bad)':'var(--ok)'}">${a.amount<0?'−':'+'}${m(Math.abs(a.amount))}</b></div>`).join('')}${danger(id,x.status)}</div><div><div class="dt">المستندات المرفوعة</div>${dc}</div></div>`)}
/* ---------- customers ---------- */
function custs(){const l=D.C.filter(x=>(F.c=='all'?x.status!='deleted':x.status==F.c)&&match(x,x.full_name,x.phone,x.city));
return `<div class="card">${chips('c',ES,D.C,'status')}<div class="tw"><table><thead><tr><th>العميل</th><th>الموبايل</th><th>المركبات</th><th>الرخصة</th><th>التسجيل</th><th>الحالة</th></tr></thead><tbody>${l.map(x=>`<tr class="cl" onclick="openC('${x.id}')"><td>${who(x)}</td><td>${phone(x)}</td><td>${x.vehicles.map(v=>E(v.brand+' '+v.model)).join('، ')||'—'}</td><td>${dots(['صورة',x.avatar_path],['رخصة',x.vehicles.some(v=>v.license_path)])}</td><td>${fdd(x.created_at)}</td><td>${tag(ES[x.status])}</td></tr>`).join('')||empty}</tbody></table></div></div>`}
async function openC(id){const x=D.C.find(c=>c.id==id);md(mh('مراجعة عميل')+'<div class="load">جاري تحميل المستندات...</div>');
 const dc=await docs([['الصورة الشخصية (من الكاميرا)',x.avatar_path,'avatars']])+(x.vehicles.length?await docs(x.vehicles.map(v=>[`رخصة ${v.brand} ${v.model} ${v.year||''} (${v.plate||'بدون لوحة'})`,v.license_path])):'<div class="doc miss">لم يضف مركبة بعد</div>');
 const pays=D.P.filter(p=>p.customer_id==id);
 const rc=pays.length?await docs(pays.map(p=>[`إيصال ${PM[p.method]} - ${m(p.amount)} (${PS[p.status][0]})`,p.receipt_path]),'receipts'):'<div class="doc miss">لا توجد مدفوعات</div>';
 const pinfo=pays.length?pays.map(p=>`<div class="kv"><span>${PM[p.method]}</span><span class="ph">${E(p.sender_account)||'—'}</span></div>`).join(''):'<div class="kv"><span>طريقة الدفع</span><span>لم يدفع بعد</span></div>';
 md(mh('مراجعة عميل')+`<div class="pane"><div>${info(x,x.vehicles.map(v=>`<div class="kv"><span>${E(v.brand)} ${E(v.model)}</span><span>${E(v.plate)||'—'}</span></div>`).join('')+'<div class="dt" style="margin-top:12px">طرق الدفع المستخدمة</div>'+pinfo+'<div class="dt" style="margin-top:12px">رصيد التعويضات</div><div class="kv"><span>الرصيد الحالي</span><b>'+m(x.balance)+'</b></div>'+D.A.filter(a=>a.engineer_id==id).map(a=>`<div class="kv"><span>${fdd(a.created_at)} — ${E(a.reason)}</span><b style="color:${a.amount<0?'var(--bad)':'var(--ok)'}">${a.amount<0?'−':'+'}${m(Math.abs(a.amount))}</b></div>`).join(''))}${actions(id,x.status)}${danger(id,x.status)}</div><div><div class="dt">رخص المركبات</div>${dc}<div class="dt" style="margin-top:8px">إيصالات الدفع</div>${rc}</div></div>`)}
/* ---------- orders ---------- */
function otable(l){return `<table><thead><tr><th>التاريخ</th><th>العميل</th><th>المهندس</th><th>المشكلة</th><th>سعر المهندس</th><th>يدفع العميل</th><th>الحالة</th></tr></thead><tbody>${l.map(o=>`<tr class="cl" onclick="openO('${o.id}')"><td>${fdd(o.created_at)}</td><td>${E(o.customer?.full_name)}</td><td>${E(o.engineer?.full_name)||'—'}</td><td>${o.warranty_of?'🛡️ ':''}${E(o.problem).slice(0,32)}</td><td>${o.price?m(o.price):'—'}</td><td>${o.total?m(o.total):'—'}</td><td>${tag(OS[o.status])}</td></tr>`).join('')||empty}</tbody></table>`}
function ords(){const l=D.O.filter(o=>(F.o=='all'||o.status==F.o)&&match(o,o.problem,o.customer?.full_name,o.engineer?.full_name));return `<div class="card">${chips('o',OS,D.O,'status')}<div class="tw">${otable(l)}</div></div>`}
async function openO(id){const o=D.O.find(x=>x.id==id);const[{data:ev},{data:jc}]=await Promise.all([sb.from('request_events').select('*').eq('request_id',id).order('id'),sb.from('job_cards').select('*').eq('request_id',id).maybeSingle()]);
 const items=(jc?.data?.items||[]).map((i,n)=>`<tr><td>${n+1}</td><td>${E(i.desc)}</td><td>${m(i.amount)}</td><td>${E(i.dept)}</td><td>${E(i.tech)}</td></tr>`).join('');
 md(mh('تفاصيل الطلب')+`<div class="pane"><div><div class="kv"><span>المشكلة</span><span>${E(o.problem)}</span></div><div class="kv"><span>العميل</span><span>${E(o.customer?.full_name)}</span></div><div class="kv"><span>موبايل العميل</span><span>${E(o.customer?.phone)}</span></div><div class="kv"><span>المركبة</span><span>${E(o.vehicles?.brand)} ${E(o.vehicles?.model)}</span></div><div class="kv"><span>المهندس</span><span>${E(o.engineer?.full_name)||'—'}</span></div>${o.odometer?`<div class="kv"><span>العداد</span><span>${o.odometer}</span></div>`:''}${o.warranty_of?'<div class="kv"><span>نوع الطلب</span><b>🛡️ ضمان مجاني</b></div>':''}${o.eta_days?`<div class="kv"><span>مدة الإصلاح المتوقعة</span><span>${o.eta_days} يوم</span></div>`:''}${o.deadline_at?`<div class="kv"><span>الموعد المتوقع للتسليم</span><span>${fd(o.deadline_at)}</span></div>`:''}${o.late_days>0?`<div class="kv"><span>أيام التأخير</span><b style="color:var(--bad)">${o.late_days}</b></div><div class="kv"><span>غرامة التأخير (رجعت للعميل)</span><b style="color:var(--bad)">${m(o.late_penalty)}</b></div>`:''}${o.warranty_until?`<div class="kv"><span>فترة التجربة حتى</span><span>${fd(o.warranty_until)}</span></div>`:''}${o.price?`<div class="kv"><span>سعر المهندس</span><span>${m(o.price)}</span></div><div class="kv"><span>عمولة المنصة</span><span>${m(o.fee)}</span></div><div class="kv"><b>إجمالي العميل</b><b>${m(o.total)}</b></div>`:''}${o.lat?`<div class="kv"><span>الموقع</span><a href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank" rel="noopener">فتح الخريطة</a></div>`:''}${orderCtl(o)}<div class="acts">${['done','cancelled','declined','delivered'].includes(o.status)?'':`<button class="btn bad" onclick="cancelO('${id}')">إلغاء الطلب</button>`}${o.status=='delivered'?`<button class="btn gh" onclick="forceDone('${id}')">إنهاء بدون تقييم</button>`:''}</div></div>
<div>${ratingBlock(o)}<div class="dt">التتبع</div>${(ev||[]).map(e=>`<div class="kv"><span>${OS[e.status][0]}</span><span>${fd(e.created_at)}</span></div>`).join('')}${jc?`<div class="dt" style="margin-top:16px">كارت التشغيل رقم ${jc.card_no}</div><div class="tw"><table><thead><tr><th>م</th><th>البند</th><th>المبلغ</th><th>القسم</th><th>الفني</th></tr></thead><tbody>${items}</tbody></table></div><div class="kv"><b>الإجمالي</b><b>${m(jc.total)}</b></div>`:''}</div></div>`)}
const ratingBlock=o=>{const r=D.R.find(x=>x.request_id==o.id);return r?`<div class="card" style="padding:14px"><div class="dt">تقييم العميل للمهندس</div><div style="font-size:22px">${starsTxt(r.stars)}</div>${r.comment?`<p style="margin:6px 0 0">${E(r.comment)}</p>`:''}</div>`:(o.status=='delivered'?'<div class="card" style="padding:14px;background:#fffbeb"><b>بانتظار تقييم العميل</b><br><span style="color:var(--mut)">فلوس المهندس هتنزل في رصيده بعد التقييم.</span></div>':'')};
async function forceDone(id){if(!confirm('إنهاء الطلب بدون تقييم؟ هتتضاف فلوس المهندس لرصيده.'))return;const{error}=await sb.rpc('admin_force_complete',{rid:id});if(error)return toast(error.message,1);cm();await load();render();toast('تم إنهاء الطلب')}
function askAdj(id,sign){$('#adj').innerHTML=`<input id="aa" type="number" min="1" step="1" placeholder="المبلغ بالجنيه" style="width:100%;margin-top:10px"><textarea id="ar" placeholder="${sign<0?'سبب الخصم (هيظهر للمهندس)':'سبب الإضافة (هيظهر للمهندس)'}"></textarea><div class="acts"><button class="btn ${sign<0?'bad':'ok'}" onclick="doAdj('${id}',${sign})">${sign<0?'تأكيد الخصم':'تأكيد الإضافة'}</button></div>`}
async function doAdj(id,sign){const a=Math.abs(+$('#aa').value),r=$('#ar').value.trim();if(!(a>0))return toast('اكتب مبلغ صحيح',1);if(r.length<3)return toast('اكتب السبب',1);const x=D.E.find(e=>e.id==id);if(!confirm((sign<0?'خصم ':'إضافة ')+m(a)+(sign<0?' من رصيد ':' إلى رصيد ')+x.full_name+'؟'))return;const{error}=await sb.rpc('admin_adjust_balance',{eid:id,amt:sign*a,reason:r});if(error)return toast(error.message,1);await load();render();openE(id);toast(sign<0?'تم الخصم':'تمت الإضافة')}
async function cancelO(id){if(!confirm('إلغاء الطلب؟'))return;const{error}=await sb.from('requests').update({status:'cancelled'}).eq('id',id);if(error)return toast(error.message,1);cm();await load();render();toast('تم إلغاء الطلب')}
/* ---------- payments ---------- */
function pays(){const l=D.P.filter(p=>(F.p=='all'||p.status==F.p)&&match(p,p.customer?.full_name,p.sender_account,p.request?.problem));
return `<div class="card">${chips('p',PS,D.P,'status')}<div class="tw"><table><thead><tr><th>العميل</th><th>الطلب</th><th>الطريقة</th><th>حساب المحوِّل</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>${l.map(p=>`<tr class="cl" onclick="openP('${p.id}')"><td><b>${E(p.customer?.full_name)}</b></td><td>${E(p.request?.problem).slice(0,28)}</td><td>${PM[p.method]}</td><td><span class="ph">${E(p.sender_account)||'—'}</span></td><td>${m(p.amount)}</td><td>${fd(p.created_at)}</td><td>${tag(PS[p.status])}</td></tr>`).join('')||empty}</tbody></table></div></div>`}
async function openP(id){const p=D.P.find(x=>x.id==id);md(mh('مراجعة إيصال دفع')+'<div class="load">جاري تحميل الإيصال...</div>');
 const rc=await docs([['إيصال الدفع',p.receipt_path]],'receipts');
 md(mh('مراجعة إيصال دفع')+`<div class="pane"><div><div class="kv"><span>العميل</span><span>${E(p.customer?.full_name)}</span></div><div class="kv"><span>موبايل العميل</span><span class="ph">${E(p.customer?.phone)}</span></div><div class="kv"><span>الطلب</span><span>${E(p.request?.problem)}</span></div><div class="kv"><span>طريقة الدفع</span><span><b>${PM[p.method]}</b></span></div><div class="kv"><span>حساب المحوِّل</span><span class="ph">${E(p.sender_account)||'—'}</span></div><div class="kv"><span>المبلغ المطلوب</span><span><b>${m(p.amount)}</b></span></div><div class="kv"><span>الحالة</span>${tag(PS[p.status])}</div>${p.reject_reason?`<div class="kv"><span>سبب الرفض</span><span>${E(p.reject_reason)}</span></div>`:''}
${p.status=='pending'?`<div id="acts"><div class="acts"><button class="btn ok" onclick="reviewPay('${id}',true)">تأكيد الدفع</button><button class="btn bad" onclick="askPayReject('${id}')">رفض الإيصال</button></div></div>`:''}</div><div><div class="dt">صورة الإيصال (تظهر للأدمن فقط)</div>${rc}</div></div>`)}
function askPayReject(id){$('#acts').innerHTML=`<textarea id="rr" placeholder="سبب الرفض (هيظهر للعميل)"></textarea><div class="acts"><button class="btn bad" onclick="reviewPay('${id}',false,$('#rr').value.trim())">تأكيد الرفض</button><button class="btn gh" onclick="cm()">إلغاء</button></div>`}
async function reviewPay(id,ok,reason){if(!ok&&!reason)return toast('اكتب سبب الرفض',1);const{error}=await sb.rpc('admin_review_payment',{pid:id,ok,reason:reason||null});if(error)return toast(error.message,1);cm();await load();render();toast(ok?'تم تأكيد الدفع':'تم رفض الإيصال')}
/* ---------- finance / settings ---------- */
function fin(){const done=D.O.filter(o=>o.status=='done');const k=(l,v)=>`<div class="kpi"><div><small>${l}</small><b>${v}</b></div></div>`;
return `<div class="kpis">${k('إجمالي المدفوع من العملاء',m(done.reduce((a,o)=>a+Number(o.total),0)))}${k('أرباح المنصة (طلبات مكتملة)',m(done.reduce((a,o)=>a+fee(o),0)))}${k('سحب معلّق',m(D.W.filter(w=>w.status=='pending').reduce((a,w)=>a+Number(w.amount),0)))}</div>
<div class="card tw"><h3>طلبات سحب الأرصدة</h3><table><thead><tr><th>صاحب الحساب</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead><tbody>${D.W.map(w=>`<tr><td>${E(w.engineer?.full_name)}</td><td>${m(w.amount)}</td><td>${fd(w.created_at)}</td><td>${tag(w.status=='paid'?['تم التحويل','#16a34a']:['معلّق','#d97706'])}</td><td>${w.status=='pending'?`<button class="btn ok" onclick="pay('${w.id}')">تم التحويل</button>`:''}</td></tr>`).join('')||empty}</tbody></table></div>
<div class="card tw"><h3>أرصدة المهندسين</h3><table><thead><tr><th>المهندس</th><th>الموبايل</th><th>الرصيد</th></tr></thead><tbody>${D.E.filter(e=>e.status=='approved').map(e=>`<tr><td>${who(e)}</td><td>${phone(e)}</td><td>${m(e.balance)}</td></tr>`).join('')||empty}</tbody></table></div>`}
async function pay(id){if(!confirm('أكد إنك حوّلت المبلغ للمهندس فعلاً؟'))return;const{error}=await sb.rpc('admin_pay_withdrawal',{wid:id});if(error)return toast(error.message,1);await load();render();toast('تم تسجيل التحويل')}
function secCard(){const on=D.S.require_admin_mfa=='1',tg=(t,c)=>`<span class="tag" style="--c:${c}">${t}</span>`;
 return `<div class="card"><h3>الأمان</h3><div class="kv"><span>التحقق بخطوتين (TOTP)</span>${MF.has?tg('مفعّل','#16a34a'):tg('غير مفعّل','#dc2626')}</div><div class="kv"><span>فرض التحقق بخطوتين على صلاحيات الأدمن</span>${on?tg('مفروض','#16a34a'):tg('غير مفروض','#6a7280')}</div><div class="acts">${MF.has?'':'<button class="btn" onclick="mfaEnroll(false)">تفعيل التحقق بخطوتين</button>'}${MF.has&&MF.aal=='aal2'?`<button class="btn ${on?'gh':'ok'}" onclick="mfaRequire(${on?0:1})">${on?'إيقاف الفرض':'فرض التحقق بخطوتين'}</button>`:''}<button class="btn gh" onclick="signAll()">تسجيل الخروج من كل الأجهزة</button></div><p style="color:var(--mut);font-size:12px">لو فرضت التحقق، أي أدمن لازم يدخل بالكود وإلا مش هيشوف أي بيانات. لو اتقفلت عليك شغّل في SQL Editor: <code dir="ltr">update settings set value='0' where key='require_admin_mfa';</code></p><p style="color:var(--mut);font-size:12px">الجلسة بتنتهي تلقائياً بعد ${D.S.admin_idle_minutes||30} دقيقة من عدم النشاط (بتتغير من «التشغيل والأمان» فوق).</p></div>`}
function policyCard(){const S=D.S,f=(k,l,u)=>`<label class="lb">${l}</label><input id="po_${k}" type="number" min="0" value="${E(S[k]||'')}" style="width:140px"> ${u}`;
 return `<div class="card"><h3>سياسة التأخير والضمان</h3>${f('late_penalty_pct','غرامة كل يوم تأخير (% من مبلغ العميل)','%')}${f('late_penalty_max_pct','أقصى غرامة (% من مبلغ العميل)','%')}${f('warranty_hours','فترة التجربة بعد التسليم','ساعة')}<div class="acts"><button class="btn" onclick="savePolicy()">حفظ</button></div><p style="color:var(--mut);font-size:12px">الغرامة بتتخصم من رصيد المهندس وبترجع لرصيد العميل عند إنهاء الطلب، ومش بتزيد عن سعر المهندس. أي جزء من اليوم بيتحسب يوم.</p></div>`}
async function savePolicy(){const g=k=>+$('#po_'+k).value,p=g('late_penalty_pct'),mx=g('late_penalty_max_pct'),h=g('warranty_hours');if(!(p>=0&&p<=50&&mx>=0&&mx<=100&&h>=0&&h<=720))return toast('راجع القيم (الغرامة 0-50%، الحد الأقصى 0-100%، الساعات 0-720)',1);const{error}=await sb.from('settings').upsert([{key:'late_penalty_pct',value:String(p)},{key:'late_penalty_max_pct',value:String(mx)},{key:'warranty_hours',value:String(h)}]);if(error)return toast(error.message,1);await load();render();toast('تم حفظ السياسة')}
function sets(){return controlCenter()+secCard()+setsBase()}
const SCHEMA=[
 {g:'المالية',ic:'💵',it:[['commission_rate','عمولة المنصة الافتراضية','%',0,100,30,'بتتضاف فوق سعر المهندس (تقدر تخصص نسبة لمهندس معين من صفحته)'],['min_job_price','أقل سعر شغل','ج',0,10000000,0,'أقل إجمالي كارت تشغيل مسموح'],['max_job_price','أعلى سعر شغل','ج',1,10000000,1000000,'أعلى إجمالي كارت تشغيل مسموح'],['min_withdrawal','أقل مبلغ سحب','ج',0,1000000,0,'']]},
 {g:'التأخير والضمان',ic:'⏱️',it:[['late_penalty_pct','غرامة كل يوم تأخير','%',0,50,5,'بتتخصم من المهندس وبترجع للعميل'],['late_penalty_max_pct','أقصى غرامة','%',0,100,50,'ولا تزيد عن سعر المهندس'],['late_penalty_base','أساس حساب الغرامة','sel',null,null,'total','',[['total','المبلغ اللي دفعه العميل'],['price','سعر المهندس فقط']]],['warranty_hours','فترة التجربة بعد التسليم','ساعة',0,720,48,'0 = بدون ضمان'],['max_eta_days','أقصى مدة إصلاح يحددها المهندس','يوم',1,365,60,'']]},
 {g:'التشغيل',ic:'⚙️',it:[['max_active_requests','أقصى طلبات شغالة للعميل','طلب',1,50,3,''],['new_requests_enabled','استقبال طلبات جديدة','tog',null,null,'1','أوقفه مؤقتاً للصيانة'],['signups_enabled','فتح التسجيل للمستخدمين الجدد','tog',null,null,'1','']]},
 {g:'الأمان',ic:'🔐',it:[['admin_idle_minutes','إنهاء جلسة الأدمن بعد عدم النشاط','دقيقة',5,480,30,'']]}];
function controlCenter(){return `<div class="card" style="background:#fffaf5"><h3>🎛️ مركز التحكم الكامل</h3><p style="margin:0;color:var(--mut)">كل نسبة ورقم في المنصة بتتغير من هنا، وبتتطبق فوراً على العمليات الجديدة. وكل تغيير بيتسجل في سجل النشاط.</p></div>`+SCHEMA.map((g,gi)=>`<div class="card"><h3>${g.ic} ${g.g}</h3>${g.it.map(([k,l,u,mn,mx,df,h,o])=>{const v=(D.S[k]!==undefined&&D.S[k]!==null)?D.S[k]:df;const f=u=='tog'?`<select id="cc_${k}"><option value="1" ${v=='1'?'selected':''}>مفعّل</option><option value="0" ${v=='0'?'selected':''}>متوقف</option></select>`:u=='sel'?`<select id="cc_${k}">${o.map(x=>`<option value="${x[0]}" ${v==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`:`<input id="cc_${k}" type="number" min="${mn}" max="${mx}" value="${E(v)}" style="width:130px"> <span style="color:var(--mut)">${u}</span>`;return `<div class="kv" style="align-items:center"><span>${l}<small class="sm">${h?h+' — ':''}الافتراضي: ${u=='tog'?(df=='1'?'مفعّل':'متوقف'):u=='sel'?o.find(x=>x[0]==df)[1]:df}</small></span><span style="white-space:nowrap">${f}</span></div>`}).join('')}<div class="acts"><button class="btn" onclick="saveGroup(${gi})">حفظ ${g.g}</button></div></div>`).join('')}
async function saveGroup(gi){const g=SCHEMA[gi],rows=[];for(const[k,l,u,mn,mx,df,h,o]of g.it){let v=$('#cc_'+k).value;if(u!='tog'&&u!='sel'){const n=+v;if(v===''||!(n>=mn&&n<=mx))return toast(`${l}: لازم تكون القيمة بين ${mn} و ${mx}`,1);v=String(n)}rows.push({key:k,value:v})}
 if(g.g=='المالية'&&+rows.find(r=>r.key=='min_job_price').value>+rows.find(r=>r.key=='max_job_price').value)return toast('أقل سعر لازم يكون أقل من أعلى سعر',1);
 const{error}=await sb.from('settings').upsert(rows);if(error)return toast(error.message,1);await load();render();toast('تم حفظ الإعدادات')}
function setsBase(){const S=D.S,inp=(k,l,ph,num)=>`<label class="lb">${l}</label><input id="st_${k}" value="${E(S[k]||'')}" placeholder="${ph||''}" ${num?`inputmode="numeric" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,11)"`:''}>`;
 return `<div class="card"><h3>💳 حسابات استلام الدفع (بتظهر للعميل)</h3>${inp('pay_instapay','رقم إنستا باي','01xxxxxxxxx',1)}${inp('pay_vodafone','رقم فودافون كاش','010xxxxxxxx',1)}${inp('pay_bank_name','اسم البنك','')}${inp('pay_bank_account','رقم الحساب / IBAN','')}${inp('pay_bank_holder','اسم صاحب الحساب البنكي','')}${inp('support_phone','رقم خدمة العملاء','01xxxxxxxxx',1)}<div class="acts"><button class="btn" onclick="savePay()">حفظ الحسابات</button></div><p style="color:var(--mut);font-size:12px">لو سبت بيانات البنك فاضية، خيار التحويل البنكي مش هيشتغل عند العميل.</p></div>`}
async function saveRate(){const v=+$('#rt').value;if(!(v>=0&&v<=100))return toast('نسبة غير صحيحة',1);const{error}=await sb.from('settings').upsert({key:'commission_rate',value:String(v)});if(error)return toast(error.message,1);await load();render();toast('تم حفظ العمولة')}
async function savePay(){const ks=['pay_instapay','pay_vodafone','pay_bank_name','pay_bank_account','pay_bank_holder','support_phone'];const rows=ks.map(k=>({key:k,value:($('#st_'+k).value||'').trim()}));
 const bad=rows.find(r=>['pay_instapay','pay_vodafone','support_phone'].includes(r.key)&&r.value&&!/^01[0-9]{9}$/.test(r.value));if(bad)return toast('الأرقام لازم تكون 11 رقم',1);
 const{error}=await sb.from('settings').upsert(rows);if(error)return toast(error.message,1);await load();render();toast('تم حفظ حسابات الدفع')}
setInterval(()=>{if(ME&&!$('#ov').innerHTML&&!document.activeElement?.matches('input,textarea')){load().then(rerender)}},30000);
let IDLE=Date.now();['click','keydown','mousemove','touchstart'].forEach(e=>addEventListener(e,()=>{IDLE=Date.now()},{passive:true}));
setInterval(()=>{if(ME&&Date.now()-IDLE>(+((D.S&&D.S.admin_idle_minutes)||30))*60000){sb.auth.signOut().then(()=>{ME=null;cm();loginUI('انتهت الجلسة بسبب عدم النشاط')})}},30000);
boot();
</script>
</body>
</html>
