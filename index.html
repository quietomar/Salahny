<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صلحني | لوحة الإدارة</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#6a7280;--bd:#e4e7ec;--pri:#e8590c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px;line-height:1.6}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#14181f;color:#c9cfd9;padding:18px 12px}
.logo{font-size:22px;font-weight:800;color:#ff7a2e;padding:0 8px 16px}
aside button{display:flex;gap:10px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px;text-align:start}
aside button.on{background:rgba(255,122,46,.18);color:#fff}
aside b{margin-inline-start:auto;background:var(--pri);color:#fff;border-radius:99px;padding:0 8px;font-size:12px}
main{padding:20px;min-width:0}
h1{font-size:22px;margin:0 0 16px}h3{margin:0 0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:24px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{color:var(--mut);font-size:12px}th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}
tr.cl:hover{background:var(--bg);cursor:pointer}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:#fff;padding:5px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;width:100%;margin-bottom:10px}
.btn{border:0;background:var(--pri);color:#fff;padding:9px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.btn.ok{background:#16a34a}.btn.bad{background:#dc2626}.btn.gh{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:#fff;border-radius:16px;padding:20px;max-width:540px;width:100%;max-height:90vh;overflow:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}.kv span:first-child{color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.lg{max-width:360px;margin:12vh auto}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:flex;overflow-x:auto;gap:4px;padding:8px}aside button{white-space:nowrap;width:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="root"></div><div id="ov"></div>
<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>Number(n||0).toLocaleString('ar-EG')+' ج',fd=d=>new Date(d).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const ES={pending:['بانتظار المراجعة','#d97706'],approved:['موافق عليه','#16a34a'],rejected:['مرفوض','#dc2626'],suspended:['موقوف','#dc2626']};
const OS={new:['طلب جديد','#2563eb'],accepted:['قبِل المهندس','#2563eb'],received:['تم استلام المركبة','#d97706'],quoted:['بانتظار موافقة العميل','#d97706'],paid:['تم الدفع','#16a34a'],progress:['جاري الإصلاح','#d97706'],done:['تم التسليم','#16a34a'],declined:['رفض العرض','#dc2626'],cancelled:['ملغي','#dc2626']};
const tag=a=>`<span class="tag" style="--c:${a[1]}">${a[0]}</span>`;
let V='dash',F={e:'all',c:'all',o:'all'},D={E:[],C:[],O:[],W:[],rate:30},ME=null;
function loginUI(msg){$('#root').innerHTML=`<div class="lg card"><h1>🔧 صلحني — الإدارة</h1>${msg?`<p style="color:#dc2626">${E(msg)}</p>`:''}<input id="ph" placeholder="الإيميل أو رقم الموبايل"><input id="pw" type="password" placeholder="كلمة السر"><button class="btn" style="width:100%" onclick="signin()">دخول</button></div>`}
async function signin(){const v=$('#ph').value.trim();const{error}=await sb.auth.signInWithPassword({email:v.includes('@')?v.toLowerCase():v+'@salhni.app',password:$('#pw').value});if(error)return loginUI('بيانات الدخول غلط ('+error.message+')');boot()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return loginUI();const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(!p||p.role!=='admin'){await sb.auth.signOut();return loginUI('هذا الحساب ليس أدمن')}ME=p;await load();render()}
async function load(){const[e,c,o,w,s]=await Promise.all([
 sb.from('profiles').select('*').eq('role','engineer').order('created_at',{ascending:false}),
 sb.from('profiles').select('*, vehicles(*)').eq('role','customer').order('created_at',{ascending:false}),
 sb.from('requests').select('*, vehicles(brand,model,plate), customer:profiles!customer_id(full_name,phone), engineer:profiles!engineer_id(full_name)').order('created_at',{ascending:false}),
 sb.from('withdrawals').select('*, engineer:profiles!engineer_id(full_name)').order('created_at',{ascending:false}),
 sb.from('settings').select('*').eq('key','commission_rate').single()]);
 D={E:e.data||[],C:c.data||[],O:o.data||[],W:w.data||[],rate:s.data?+s.data.value:30}}
const NAV=[['dash','📊','الرئيسية'],['e','🧑‍🔧','المهندسين'],['c','👤','العملاء'],['o','📋','الطلبات'],['f','💰','المالية'],['s','⚙️','الإعدادات']];
function render(){const cnt={e:D.E.filter(x=>x.status=='pending').length,c:D.C.filter(x=>x.status=='pending').length,o:D.O.filter(x=>x.status=='new').length,f:D.W.filter(x=>x.status=='pending').length};
$('#root').innerHTML=`<div class="app"><aside><div class="logo">🔧 صلحني</div>${NAV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="V='${n[0]}';render()">${n[1]} ${n[2]}${cnt[n[0]]?`<b>${cnt[n[0]]}</b>`:''}</button>`).join('')}<button onclick="refresh()">🔄 تحديث</button><button onclick="sb.auth.signOut().then(()=>loginUI())">🚪 خروج</button></aside><main>${({dash,e:engs,c:custs,o:ords,f:fin,s:sets})[V]()}</main></div>`}
async function refresh(){await load();render()}
const chips=(k,map)=>`<div class="bar">${[['all','الكل'],...Object.entries(map).map(([a,b])=>[a,b[0]])].map(c=>`<button class="chip ${F[k]==c[0]?'on':''}" onclick="F['${k}']='${c[0]}';render()">${c[1]}</button>`).join('')}</div>`;
const fee=o=>Number(o.fee||0);
function dash(){const com=D.O.filter(o=>['paid','progress','done'].includes(o.status)).reduce((a,o)=>a+fee(o),0),owed=D.E.reduce((a,e)=>a+Number(e.balance),0);
const pend=[...D.E.filter(x=>x.status=='pending').map(x=>`<div class="kv"><span>🧑‍🔧 ${E(x.full_name)}</span><button class="btn gh" onclick="V='e';render();openE('${x.id}')">مراجعة</button></div>`),...D.C.filter(x=>x.status=='pending'&&x.vehicles.length).map(x=>`<div class="kv"><span>👤 ${E(x.full_name)}</span><button class="btn gh" onclick="V='c';render();openC('${x.id}')">مراجعة</button></div>`)].join('')||'<span style="color:var(--mut)">مفيش طلبات معلّقة ✅</span>';
return `<h1>لوحة التحكم</h1><div class="kpis"><div class="kpi"><small>طلبات نشطة</small><b>${D.O.filter(o=>['accepted','received','quoted','paid','progress'].includes(o.status)).length}</b></div><div class="kpi"><small>عمولة المنصة (${D.rate}%)</small><b>${m(com)}</b></div><div class="kpi"><small>أرصدة المهندسين</small><b>${m(owed)}</b></div><div class="kpi"><small>مهندسين معتمدين</small><b>${D.E.filter(x=>x.status=='approved').length}</b></div><div class="kpi"><small>عملاء</small><b>${D.C.length}</b></div></div><div class="card"><h3>بانتظار موافقتك</h3>${pend}</div><div class="card tw"><h3>آخر الطلبات</h3>${otable(D.O.slice(0,6))}</div>`}
function engs(){const l=D.E.filter(x=>F.e=='all'||x.status==F.e);return `<h1>المهندسين</h1><div class="card">${chips('e',ES)}<div class="tw"><table><tr><th>الاسم</th><th>الموبايل</th><th>الكارنيه</th><th>المدينة</th><th>الرصيد</th><th>الحالة</th></tr>${l.map(x=>`<tr class="cl" onclick="openE('${x.id}')"><td><b>${E(x.full_name)}</b></td><td>${E(x.phone)}</td><td>${E(x.syndicate_no)}</td><td>${E(x.city)}</td><td>${m(x.balance)}</td><td>${tag(ES[x.status])}</td></tr>`).join('')||'<tr><td>لا يوجد</td></tr>'}</table></div></div>`}
async function doc(p){const w=window.open('','_blank');const{data,error}=await sb.storage.from('docs').createSignedUrl(p,300);if(error){w.close();return alert('تعذر فتح الملف')}w.location=data.signedUrl}
const docBtn=(p,l)=>p?`<button class="btn gh" onclick="doc('${E(p)}')">${l}</button>`:`<span style="color:var(--mut)">${l}: غير مرفوع</span>`;
function actions(id,s){return `<div class="acts">${s=='approved'?`<button class="btn bad" onclick="setS('${id}','suspended')">إيقاف</button>`:s=='suspended'?`<button class="btn ok" onclick="setS('${id}','approved')">إعادة تفعيل</button>`:`<button class="btn ok" onclick="setS('${id}','approved')">موافقة</button>${s!='rejected'?`<button class="btn bad" onclick="setS('${id}','rejected')">رفض</button>`:''}`}<button class="btn gh" onclick="cm()">إغلاق</button></div>`}
function openE(id){const x=D.E.find(e=>e.id==id),done=D.O.filter(o=>o.engineer_id==id&&o.status=='done');
md(`<h3>${E(x.full_name)}</h3><div class="kv"><span>الموبايل</span><span>${E(x.phone)}</span></div><div class="kv"><span>رقم الكارنيه</span><span>${E(x.syndicate_no)}</span></div><div class="kv"><span>المدينة</span><span>${E(x.city)}</span></div><div class="kv"><span>الرصيد</span><span>${m(x.balance)}</span></div><div class="kv"><span>الحالة</span>${tag(ES[x.status])}</div><div class="acts">${docBtn(x.card_path,'🪪 كارنيه النقابة')}${docBtn(x.cv_path,'📄 CV')}</div>${done.length?`<p style="color:var(--mut)">سيارات أصلحها (${done.length}): ${done.map(o=>E(o.vehicles?.brand+' '+o.vehicles?.model)).join('، ')}</p>`:''}${actions(id,x.status)}`)}
function custs(){const l=D.C.filter(x=>F.c=='all'||x.status==F.c);return `<h1>العملاء</h1><div class="card">${chips('c',ES)}<div class="tw"><table><tr><th>الاسم</th><th>الموبايل</th><th>المركبات</th><th>الحالة</th></tr>${l.map(x=>`<tr class="cl" onclick="openC('${x.id}')"><td><b>${E(x.full_name)}</b></td><td>${E(x.phone)}</td><td>${x.vehicles.map(v=>E(v.brand+' '+v.model)).join('، ')||'—'}</td><td>${tag(ES[x.status])}</td></tr>`).join('')||'<tr><td>لا يوجد</td></tr>'}</table></div></div>`}
function openC(id){const x=D.C.find(c=>c.id==id);md(`<h3>${E(x.full_name)}</h3><div class="kv"><span>الموبايل</span><span>${E(x.phone)}</span></div><div class="kv"><span>الحالة</span>${tag(ES[x.status])}</div>${x.vehicles.map(v=>`<div class="kv"><span>${E(v.brand)} ${E(v.model)} ${E(v.year)} • ${E(v.plate)}</span>${docBtn(v.license_path,'🪪 الرخصة')}</div>`).join('')||'<p style="color:var(--mut)">لم يضف مركبة بعد</p>'}${actions(id,x.status)}`)}
async function setS(id,s){let r=null;if(s=='rejected'){r=prompt('سبب الرفض (يظهر للمستخدم):')||'';}const{error}=await sb.from('profiles').update({status:s,reject_reason:r}).eq('id',id);if(error)return alert(error.message);cm();refresh()}
function otable(l){return `<table><tr><th>التاريخ</th><th>العميل</th><th>المهندس</th><th>المشكلة</th><th>سعر المهندس</th><th>يدفع العميل</th><th>الحالة</th></tr>${l.map(o=>`<tr class="cl" onclick="openO('${o.id}')"><td>${fd(o.created_at)}</td><td>${E(o.customer?.full_name)}</td><td>${E(o.engineer?.full_name)||'—'}</td><td>${E(o.problem).slice(0,30)}</td><td>${o.price?m(o.price):'—'}</td><td>${o.total?m(o.total):'—'}</td><td>${tag(OS[o.status])}</td></tr>`).join('')}</table>`}
function ords(){const l=D.O.filter(o=>F.o=='all'||o.status==F.o);return `<h1>الطلبات</h1><div class="card">${chips('o',OS)}<div class="tw">${otable(l)}</div></div>`}
async function openO(id){const o=D.O.find(x=>x.id==id),{data:ev}=await sb.from('request_events').select('*').eq('request_id',id).order('id');
md(`<h3>${E(o.problem)}</h3><div class="kv"><span>العميل</span><span>${E(o.customer?.full_name)} • ${E(o.customer?.phone)}</span></div><div class="kv"><span>المركبة</span><span>${E(o.vehicles?.brand)} ${E(o.vehicles?.model)} • ${E(o.vehicles?.plate)}</span></div><div class="kv"><span>المهندس</span><span>${E(o.engineer?.full_name)||'—'}</span></div>${o.odometer?`<div class="kv"><span>العداد</span><span>${o.odometer}</span></div>`:''}${o.price?`<div class="kv"><span>سعر المهندس</span><span>${m(o.price)}</span></div><div class="kv"><span>عمولة المنصة</span><span>${m(o.fee)}</span></div><div class="kv"><b>إجمالي العميل</b><b>${m(o.total)}</b></div>`:''}${o.lat?`<div class="kv"><span>الموقع</span><a href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank">فتح الخريطة</a></div>`:''}<h3 style="margin-top:12px">التتبع</h3>${(ev||[]).map(e=>`<div class="kv"><span>${OS[e.status][0]}</span><span>${fd(e.created_at)}</span></div>`).join('')}<div class="acts">${['done','cancelled','declined'].includes(o.status)?'':`<button class="btn bad" onclick="cancelO('${id}')">إلغاء الطلب</button>`}<button class="btn gh" onclick="cm()">إغلاق</button></div>`)}
async function cancelO(id){if(!confirm('إلغاء الطلب؟'))return;const{error}=await sb.from('requests').update({status:'cancelled'}).eq('id',id);if(error)return alert(error.message);cm();refresh()}
function fin(){const done=D.O.filter(o=>o.status=='done');return `<h1>المالية</h1><div class="kpis"><div class="kpi"><small>إجمالي المدفوع من العملاء</small><b>${m(done.reduce((a,o)=>a+Number(o.total),0))}</b></div><div class="kpi"><small>أرباح المنصة (طلبات مكتملة)</small><b>${m(done.reduce((a,o)=>a+fee(o),0))}</b></div><div class="kpi"><small>سحب معلّق</small><b>${m(D.W.filter(w=>w.status=='pending').reduce((a,w)=>a+Number(w.amount),0))}</b></div></div><div class="card tw"><h3>طلبات سحب الأرصدة</h3><table><tr><th>المهندس</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th><th></th></tr>${D.W.map(w=>`<tr><td>${E(w.engineer?.full_name)}</td><td>${m(w.amount)}</td><td>${fd(w.created_at)}</td><td>${tag(w.status=='paid'?['تم التحويل','#16a34a']:['معلّق','#d97706'])}</td><td>${w.status=='pending'?`<button class="btn ok" onclick="pay('${w.id}')">تم التحويل</button>`:''}</td></tr>`).join('')||'<tr><td>لا يوجد</td></tr>'}</table></div><div class="card tw"><h3>أرصدة المهندسين</h3><table><tr><th>المهندس</th><th>الرصيد</th></tr>${D.E.filter(e=>e.status=='approved').map(e=>`<tr><td>${E(e.full_name)}</td><td>${m(e.balance)}</td></tr>`).join('')}</table></div>`}
async function pay(id){if(!confirm('أكد إنك حوّلت المبلغ للمهندس فعلاً؟'))return;const{error}=await sb.rpc('admin_pay_withdrawal',{wid:id});if(error)return alert(error.message);refresh()}
function sets(){return `<h1>الإعدادات</h1><div class="card"><h3>عمولة المنصة (% تُضاف فوق سعر المهندس)</h3><input id="rt" type="number" min="0" max="100" value="${D.rate}" style="width:110px"><button class="btn" onclick="saveRate()">حفظ</button><p style="color:var(--mut)">تنطبق على العروض الجديدة فقط. مثال: 1000 ج ← العميل يدفع ${m(1000+1000*D.rate/100)} ← المنصة ${m(1000*D.rate/100)}.</p></div>`}
async function saveRate(){const v=+$('#rt').value;if(!(v>=0&&v<=100))return alert('نسبة غير صحيحة');const{error}=await sb.from('settings').upsert({key:'commission_rate',value:String(v)});if(error)return alert(error.message);refresh()}
function md(h){$('#ov').innerHTML=`<div class="ov" onclick="if(event.target==this)cm()"><div class="md">${h}</div></div>`}
function cm(){$('#ov').innerHTML=''}
setInterval(()=>{if(ME&&!$('#ov').innerHTML)refresh()},30000);
boot();
</script>
</body>
</html>
